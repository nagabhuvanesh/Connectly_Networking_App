<script>
  let currentMode = 'signin';

  function switchAuthTab(mode) {
    currentMode = mode;
    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');
    const nameField = document.getElementById('name-field-wrap');
    const title = document.getElementById('auth-title');
    const subtitle = document.getElementById('auth-subtitle');
    const forgotBtn = document.getElementById('forgot-pass-btn');
    const ctaText = document.getElementById('cta-text');
    const switchPrompt = document.getElementById('switch-prompt-btn');

    if (mode === 'signin') {
      tabSignin.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-on-primary bg-primary shadow-sm transition-all duration-200';
      tabSignup.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200';
      nameField.classList.add('hidden');
      title.innerText = 'Welcome back';
      subtitle.innerText = 'The fastest way to exchange credentials and remember who you met.';
      forgotBtn.classList.remove('invisible');
      ctaText.innerHTML = 'Sign In to Connectly <span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      switchPrompt.innerHTML = 'Don&apos;t have an account? <span class="text-primary font-semibold hover:underline">Sign Up</span>';
    } else {
      tabSignup.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-on-primary bg-primary shadow-sm transition-all duration-200';
      tabSignin.className = 'flex-1 py-2 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200';
      nameField.classList.remove('hidden');
      title.innerText = 'Get started with Connectly';
      subtitle.innerText = 'Instant digital business cards and high-trust contact exchange.';
      forgotBtn.classList.add('invisible');
      ctaText.innerHTML = 'Create Free Account <span class="material-symbols-outlined text-[18px]">sparkles</span>';
      switchPrompt.innerHTML = 'Already have an account? <span class="text-primary font-semibold hover:underline">Sign In</span>';
    }
  }

  function toggleMode() {
    switchAuthTab(currentMode === 'signin' ? 'signup' : 'signin');
  }

  function togglePasswordVisibility() {
    const input = document.getElementById('password-input');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerText = 'visibility_off';
    } else {
      input.type = 'password';
      icon.innerText = 'visibility';
    }
  }
</script></main></body></html>
