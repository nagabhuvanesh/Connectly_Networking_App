<script>
  (function initSplashMicroBehaviors() {
    const statusText = document.getElementById('loading-status-text');
    const percentage = document.getElementById('loading-percentage');
    const progressBar = document.getElementById('loading-progress-bar');
    
    if (!statusText || !percentage || !progressBar) return;

    const stages = [
      { pct: 72, label: 'Syncing executive registry...' },
      { pct: 88, label: 'Securing tactile peer tokens...' },
      { pct: 97, label: 'Opening personal space...' },
      { pct: 100, label: 'Ready' }
    ];

    let currentStep = 0;
    const interval = setInterval(() => {
      if (currentStep < stages.length) {
        const step = stages[currentStep];
        progressBar.style.width = step.pct + '%';
        percentage.textContent = step.pct + '%';
        statusText.textContent = step.label;
        currentStep++;
      } else {
        clearInterval(interval);
      }
    }, 650);
  })();
