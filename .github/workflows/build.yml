name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Connectly
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android - assemble debug
        run: ./gradlew :composeApp:assembleDebug

      - name: Web (Wasm) - production distribution build
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: iOS - compile shared code (compile-check only, no Xcode build)
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64
